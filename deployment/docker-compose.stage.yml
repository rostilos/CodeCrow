# Independent staging stack. Volumes and networks belong to the codecrow-stage project.
# Images use staging-only GHCR packages; server-deploy-stage.sh pins per-service tags.
# SQLite generations persist in structural_index_data; no vector/embedding service is required.
name: codecrow-stage
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecrow_stage}
      POSTGRES_USER: ${POSTGRES_USER:-codecrow_stage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codecrow-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-codecrow_stage} -d $${POSTGRES_DB:-codecrow_stage}
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'True'
      PGADMIN_DISABLE_POSTFIX: 'True'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - 127.0.0.1:${PGADMIN_HOST_PORT:-15050}:80
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - codecrow-network
    restart: unless-stopped
    profiles:
      - tools
  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT:-16379}:6379
    volumes:
      - redis_data:/data
    networks:
      - codecrow-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
  web-server:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER must be set}/codecrow-stage-web-server:${WEB_SERVER_IMAGE_TAG:-stage}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codecrow_stage}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codecrow_stage}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: 'false'
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_CONFIG_LOCATION: file:/app/config/application.properties
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: 'true'
      SPRING_FLYWAY_BASELINE_VERSION: '0'
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/managed
      SERVER_PORT: 8081
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
      LOGGING_FILE_NAME: /app/logs/codecrow-web-application.log
      CODECROW_INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      CODECROW_RAG_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      CODECROW_RAG_API_URL: http://rag-pipeline:8001
      CODECROW_PIPELINE_AGENT_BASE_URL: http://pipeline-agent:8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ANALYSIS_MAX_FILES: ${ANALYSIS_MAX_FILES:-150}
      ANALYSIS_MAX_FILE_SIZE_BYTES: ${ANALYSIS_MAX_FILE_SIZE_BYTES:-5242880}
      ANALYSIS_MAX_TOTAL_DIFF_SIZE_BYTES: ${ANALYSIS_MAX_TOTAL_DIFF_SIZE_BYTES:-20971520}
      ANALYSIS_MAX_TOTAL_TOKENS: ${ANALYSIS_MAX_TOTAL_TOKENS:-1000000}
    ports:
      - 127.0.0.1:${WEB_SERVER_HOST_PORT:-18081}:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fix-permissions:
        condition: service_completed_successfully
    networks:
      - codecrow-network
    volumes:
      - source_code_tmp:/tmp
      - web_logs:/app/logs
      - ./config/java-shared/application.properties:/run/codecrow-config/application.properties:ro
      - ./config/java-shared/github-private-key:/app/codecrow-config:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8081/actuator/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
  pipeline-agent:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER must be set}/codecrow-stage-pipeline-agent:${PIPELINE_AGENT_IMAGE_TAG:-stage}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codecrow_stage}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codecrow_stage}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: 'false'
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_CONFIG_LOCATION: file:/app/config/application.properties
      SPRING_FLYWAY_ENABLED: 'false'
      SERVER_PORT: 8082
      SPRING_SESSION_STORE_TYPE: redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      CODECROW_RAG_API_URL: http://rag-pipeline:8001
      RAG_ENABLED: 'true'
      CODECROW_RAG_LIFECYCLE_FAILED_RETRY_MINUTES: ${RAG_LIFECYCLE_FAILED_RETRY_MINUTES:-60}
      CODECROW_INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      CODECROW_RAG_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      ANALYSIS_MAX_FILES: ${ANALYSIS_MAX_FILES:-150}
      ANALYSIS_MAX_FILE_SIZE_BYTES: ${ANALYSIS_MAX_FILE_SIZE_BYTES:-5242880}
      ANALYSIS_MAX_TOTAL_DIFF_SIZE_BYTES: ${ANALYSIS_MAX_TOTAL_DIFF_SIZE_BYTES:-20971520}
      ANALYSIS_MAX_TOTAL_TOKENS: ${ANALYSIS_MAX_TOTAL_TOKENS:-1000000}
      PR_ENRICHMENT_MAX_FILE_SIZE_BYTES: ${PR_ENRICHMENT_MAX_FILE_SIZE_BYTES:-5242880}
      PR_ENRICHMENT_MAX_TOTAL_SIZE_BYTES: ${PR_ENRICHMENT_MAX_TOTAL_SIZE_BYTES:-20971520}
      CODECROW_VCS_FILE_RETRIEVAL_ARCHIVE_THRESHOLD: ${VCS_FILE_RETRIEVAL_ARCHIVE_THRESHOLD:-25}
      RAG_ARCHIVE_MAX_ENTRY_SIZE_BYTES: ${RAG_ARCHIVE_MAX_ENTRY_SIZE_BYTES:-268435456}
      RAG_ARCHIVE_MAX_EXTRACTED_SIZE_BYTES: ${RAG_ARCHIVE_MAX_EXTRACTED_SIZE_BYTES:-4294967296}
      RAG_ARCHIVE_MAX_ENTRIES: ${RAG_ARCHIVE_MAX_ENTRIES:-500000}
      ANALYSIS_QUEUE_INACTIVITY_TIMEOUT_MINUTES: ${ANALYSIS_QUEUE_INACTIVITY_TIMEOUT_MINUTES:-15}
      ANALYSIS_QUEUE_ADMISSION_TIMEOUT_MINUTES: ${ANALYSIS_QUEUE_ADMISSION_TIMEOUT_MINUTES:-5}
      ANALYSIS_PROMPT_DRY_RUN_ENABLED: ${ANALYSIS_PROMPT_DRY_RUN_ENABLED:-false}
      ANALYSIS_PROMPT_DRY_RUN_PROJECT_IDS: ${ANALYSIS_PROMPT_DRY_RUN_PROJECT_IDS:-}
      LOGGING_FILE_NAME: /app/logs/codecrow-pipeline-agent.log
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CODECROW_RAG_BRANCH_BUILD_GLOBAL_PARALLELISM: ${RAG_BRANCH_BUILD_PARALLELISM:-16}
    ports:
      - 127.0.0.1:${PIPELINE_AGENT_HOST_PORT:-18082}:8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference-orchestrator:
        condition: service_healthy
      fix-permissions:
        condition: service_completed_successfully
      web-server:
        condition: service_healthy
    networks:
      - codecrow-network
    volumes:
      - source_code_tmp:/tmp
      - pipeline_agent_logs:/app/logs
      - ./config/java-shared/application.properties:/run/codecrow-config/application.properties:ro
      - ./config/java-shared/github-private-key:/app/codecrow-config:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8082/actuator/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
  inference-orchestrator:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER must be set}/codecrow-stage-inference-orchestrator:${INFERENCE_ORCHESTRATOR_IMAGE_TAG:-stage}
    ports:
      - 127.0.0.1:${INFERENCE_ORCHESTRATOR_HOST_PORT:-18000}:8000
    depends_on:
      web-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CODECROW_API_URL: http://web-server:8081
      PLATFORM_MCP_JAR: /app/codecrow-platform-mcp-1.0.jar
      MCP_USE_ANONYMIZED_TELEMETRY: ${MCP_USE_ANONYMIZED_TELEMETRY:-false}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      SERVICE_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      RAG_API_URL: http://rag-pipeline:8001
      ANALYSIS_QUEUE_HEARTBEAT_SECONDS: ${ANALYSIS_QUEUE_HEARTBEAT_SECONDS:-30}
      ANALYSIS_CONSUMER_HEARTBEAT_SECONDS: ${ANALYSIS_CONSUMER_HEARTBEAT_SECONDS:-5}
      ANALYSIS_PROMPT_DRY_RUN_ENABLED: ${ANALYSIS_PROMPT_DRY_RUN_ENABLED:-false}
      ANALYSIS_PROMPT_DRY_RUN_SYNTHETIC_FINDINGS_PER_FILE: ${ANALYSIS_PROMPT_DRY_RUN_SYNTHETIC_FINDINGS_PER_FILE:-6}
      ANALYSIS_PROMPT_DRY_RUN_SYNTHETIC_FINDINGS_MAX_TOTAL: ${ANALYSIS_PROMPT_DRY_RUN_SYNTHETIC_FINDINGS_MAX_TOTAL:-24}
      ANALYSIS_PROMPT_DRY_RUN_OUTPUT_DIR: /app/logs/prompt-dry-runs
      REVIEW_QUALITY_CAPTURE_ENABLED: ${REVIEW_QUALITY_CAPTURE_ENABLED:-false}
      REVIEW_QUALITY_CAPTURE_PROJECT_IDS: ${REVIEW_QUALITY_CAPTURE_PROJECT_IDS:-}
      REVIEW_QUALITY_CAPTURE_OUTPUT_DIR: /app/logs/review-quality-captures
      REVIEW_QUALITY_CAPTURE_MAX_FILES: ${REVIEW_QUALITY_CAPTURE_MAX_FILES:-20}
      REDIS_URL: redis://redis:6379/1
    networks:
      - codecrow-network
    volumes:
      - source_code_tmp:/tmp
      - ./config/inference-orchestrator/.env:/run/codecrow-config/inference-orchestrator.env:ro
      - inference_orchestrator_logs:/app/logs
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
  rag-pipeline:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER must be set}/codecrow-stage-rag-pipeline:${RAG_PIPELINE_IMAGE_TAG:-stage}
    environment:
      SERVICE_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in .env}
      REDIS_URL: redis://redis:6379/1
      STRUCTURAL_INDEX_ROOT: /var/lib/codecrow/structural-index
      UVICORN_WORKERS: ${RAG_UVICORN_WORKERS:-1}
    ports:
      - 127.0.0.1:${RAG_PIPELINE_HOST_PORT:-18001}:8001
    depends_on:
      redis:
        condition: service_healthy
      fix-permissions:
        condition: service_completed_successfully
    networks:
      - codecrow-network
    volumes:
      - source_code_tmp:/tmp
      - structural_index_data:/var/lib/codecrow/structural-index
      - rag_logs:/app/logs
      - ./config/rag-pipeline/.env:/run/codecrow-config/rag-pipeline.env:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8001/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
  web-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER must be set}/codecrow-stage-web-frontend:${WEB_FRONTEND_IMAGE_TAG:-stage}
    ports:
      - 127.0.0.1:${WEB_FRONTEND_HOST_PORT:-18080}:8080
    networks:
      - codecrow-network
    volumes:
      - web_frontend_logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null http://127.0.0.1:8080 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  fix-permissions:
    image: busybox
    command: sh -c "chmod 1777 /tmp && chown 1001:1001 /var/lib/codecrow/structural-index"
    volumes:
      - source_code_tmp:/tmp
      - structural_index_data:/var/lib/codecrow/structural-index
volumes:
  source_code_tmp:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  structural_index_data:
    driver: local
  pgadmin_data:
    driver: local
  web_logs:
    driver: local
  pipeline_agent_logs:
    driver: local
  web_frontend_logs:
    driver: local
  rag_logs:
    driver: local
  inference_orchestrator_logs:
    driver: local
networks:
  codecrow-network:
    driver: bridge
